[env:idle_selftest]
build_flags = -DPOWER_IDLE_SELFTEST -DIDLE_TEST_TIMING
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM3
monitor_port = COM3
lib_deps =
  adafruit/Adafruit GFX Library@1.12.4
  adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
