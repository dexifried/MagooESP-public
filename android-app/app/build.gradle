plugins { id 'com.android.application' }
android { namespace 'ca.magoo.gps'; compileSdk 35; buildToolsVersion '35.0.0'
  defaultConfig { applicationId 'ca.magoo.gps'; minSdk 26; targetSdk 35; versionCode 8; versionName '8.0-test' }
}


// Bundle the exact same dashboard assets used by the browser.
def dashboardAssets = layout.buildDirectory.dir('generated/magoo-assets')
android.sourceSets.main.assets.srcDir(dashboardAssets)
tasks.register('copyDashboardAssets', Sync) {
  from(rootProject.file('../web'))
  include 'dashboard.html', 'dashboard-polish.css', 'pairing.css', 'pairing.js', 'frame-delta.js', 'music-installer.js', 'music-pack.js', 'hero.jpg', 'home.jpg', 'speed.jpg', 'navigation.jpg', 'music.jpg'
  into(dashboardAssets)
  inputs.file(rootProject.file('../include/AlbumArt.h'))
  inputs.property('magooVersionCode', android.defaultConfig.versionCode)
  inputs.property('magooVersionName', android.defaultConfig.versionName)
  doLast {
    new File(dashboardAssets.get().asFile, 'magoo-version.json').text = groovy.json.JsonOutput.toJson([
      applicationId: android.defaultConfig.applicationId,
      versionCode: android.defaultConfig.versionCode,
      versionName: android.defaultConfig.versionName
    ])
    def album = rootProject.file('../include/AlbumArt.h').getText('UTF-8')
    def output = new File(dashboardAssets.get().asFile, 'album')
    output.mkdirs()
    ['EIGHT', 'LOVE', 'GOODBYE'].eachWithIndex { name, index ->
      def match = (album =~ /(?s)JPG_${name}\[\]\s+PROGMEM\s*=\s*\{(.*?)\}/)
      if (!match.find()) throw new GradleException("Missing album art: ${name}")
      new File(output, "${index}.jpg").bytes = match.group(1).split(',').findAll { it.trim() }.collect { it.trim().toInteger() as byte } as byte[]
    }
  }
}
tasks.named('preBuild').configure { dependsOn('copyDashboardAssets') }
