<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090a0b"><title>Magoo · Standby</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#090a0b;color:#f6f6f6;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}.standby{width:min(100%,420px);text-align:center}.mark{display:grid;place-items:center;margin:auto auto 28px;width:76px;height:76px;border:1px solid #45484a;border-radius:24px;background:linear-gradient(145deg,#212224,#141517);color:#bbb}.mark svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}.eyebrow{font-size:10px;color:#a9aaad;font-weight:700;letter-spacing:.18em}h1{font-size:30px;letter-spacing:-.035em;margin:12px 0}.caption{color:#a8aaad;font-size:14px;line-height:1.5;margin:0 auto 30px;max-width:310px}.actions{display:grid;gap:10px}button,a{min-height:54px;border-radius:12px;font:inherit;font-size:15px;font-weight:700;display:grid;place-items:center;cursor:pointer;text-decoration:none}button{background:#c2242e;color:white;border:1px solid #e23c47}a{background:#1b1c1e;color:#eee;border:1px solid #414346}button:disabled{opacity:.6;cursor:wait}.message{font-size:12px;color:#f28c94;margin:14px 0 0;min-height:18px}button:focus-visible,a:focus-visible{outline:2px solid white;outline-offset:3px}
</style></head><body><main class="standby"><div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2v10M6.34 5.64a8 8 0 1 0 11.32 0"/></svg></div><div class="eyebrow">MAGOO WEB DASHBOARD</div><h1>Currently Asleep</h1><p class="caption">Wake the web dashboard, or use the Magoo app.</p><div class="actions"><button id="wake" type="button">Wake Up</button><a href="https://magoo.dexifyz.com/">Use app</a></div><p class="message" id="message" role="status"></p></main><script>
const wake=document.getElementById('wake'),message=document.getElementById('message');
wake.addEventListener('click',async()=>{wake.disabled=true;message.textContent='';try{const response=await fetch('/sleep',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'sleep=0&web=1'});if(!response.ok)throw Error();location.replace('/')}catch(_){message.textContent='Couldn’t wake Magoo. Check your connection and try again.';wake.disabled=false}});
async function check(){if(document.hidden||wake.disabled)return;try{const response=await fetch('/status',{cache:'no-store'});if(response.ok){const state=await response.json();if(!state.sleeping&&state.webUnlocked)location.replace('/')}}catch(_){}}
setInterval(check,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
</script></body></html>
