<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="1  |  Power the dashboard">
<rect width="100%" height="100%" rx="22" fill="#101317"/>
<text x="44" y="54" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="bold">1  |  Power the dashboard</text>
<text x="44" y="84" fill="#b8c1cb" font-family="Arial,sans-serif" font-size="18">The display is built into the original IdeaSpark board.</text>
<rect x="65" y="145" width="300" height="145" rx="14" fill="#1d242c" stroke="#566575" stroke-width="2"/>
<text x="85" y="180" text-anchor="start" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="bold">USB 5 V SUPPLY</text>
<text x="85" y="207" text-anchor="start" fill="#bac5cf" font-family="Arial,sans-serif" font-size="16" font-weight="normal">Computer or USB power adapter</text>
<rect x="785" y="125" width="340" height="185" rx="14" fill="#1d242c" stroke="#566575" stroke-width="2"/>
<text x="805" y="160" text-anchor="start" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="bold">ESP32 + DISPLAY</text>
<text x="805" y="187" text-anchor="start" fill="#bac5cf" font-family="Arial,sans-serif" font-size="16" font-weight="normal">IdeaSpark integrated screen</text>
<polyline points="365,217 785,217" fill="none" stroke="#fb6472" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="575" y="197" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="bold">USB cable</text>
<text x="575" y="252" text-anchor="middle" fill="#bac5cf" font-family="Arial,sans-serif" font-size="17" font-weight="normal">connect to board USB port</text>
<text x="65" y="365" text-anchor="start" fill="#f5ce70" font-family="Arial,sans-serif" font-size="20" font-weight="normal">External display? Use the display pin table in the guide.</text>
</svg>
