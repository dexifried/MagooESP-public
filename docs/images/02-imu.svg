<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="2  |  Connect the tilt sensor">
<rect width="100%" height="100%" rx="22" fill="#101317"/>
<text x="44" y="54" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="bold">2  |  Connect the tilt sensor</text>
<text x="44" y="84" fill="#b8c1cb" font-family="Arial,sans-serif" font-size="18">Match the printed pin names; the diagram does not show physical pin order.</text>
<rect x="55" y="120" width="300" height="275" rx="14" fill="#1d242c" stroke="#566575" stroke-width="2"/>
<text x="75" y="155" text-anchor="start" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="bold">ESP32</text>
<text x="75" y="182" text-anchor="start" fill="#bac5cf" font-family="Arial,sans-serif" font-size="16" font-weight="normal">3.3 V logic</text>
<rect x="845" y="120" width="300" height="275" rx="14" fill="#1d242c" stroke="#566575" stroke-width="2"/>
<text x="865" y="155" text-anchor="start" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="bold">MPU SENSOR</text>
<text x="865" y="182" text-anchor="start" fill="#bac5cf" font-family="Arial,sans-serif" font-size="16" font-weight="normal">3.3 V-compatible breakout</text>
<text x="330" y="217" text-anchor="end" fill="#fb6472" font-family="Arial,sans-serif" font-size="20" font-weight="bold">3V3</text>
<polyline points="355,210 845,210" fill="none" stroke="#fb6472" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="870" y="217" text-anchor="start" fill="#fb6472" font-family="Arial,sans-serif" font-size="20" font-weight="bold">VCC</text>
<text x="330" y="267" text-anchor="end" fill="#c3cbd3" font-family="Arial,sans-serif" font-size="20" font-weight="bold">GND</text>
<polyline points="355,260 845,260" fill="none" stroke="#c3cbd3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="870" y="267" text-anchor="start" fill="#c3cbd3" font-family="Arial,sans-serif" font-size="20" font-weight="bold">GND</text>
<text x="330" y="317" text-anchor="end" fill="#70baff" font-family="Arial,sans-serif" font-size="20" font-weight="bold">D21 / GPIO21</text>
<polyline points="355,310 845,310" fill="none" stroke="#70baff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="870" y="317" text-anchor="start" fill="#70baff" font-family="Arial,sans-serif" font-size="20" font-weight="bold">SDA</text>
<text x="330" y="367" text-anchor="end" fill="#6ee3b2" font-family="Arial,sans-serif" font-size="20" font-weight="bold">D22 / GPIO22</text>
<polyline points="355,360 845,360" fill="none" stroke="#6ee3b2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="870" y="367" text-anchor="start" fill="#6ee3b2" font-family="Arial,sans-serif" font-size="20" font-weight="bold">SCL</text>
<text x="600" y="453" text-anchor="middle" fill="#f5ce70" font-family="Arial,sans-serif" font-size="19" font-weight="normal">Mount Y front-to-back and X side-to-side; then set level.</text>
</svg>
