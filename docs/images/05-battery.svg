<text x="315" y="582" text-anchor="end" fill="#c3cbd3" font-family="Arial,sans-serif" font-size="18" font-weight="bold">NEGATIVE −</text>
<text x="600" y="651" text-anchor="middle" fill="#f5ce70" font-family="Arial,sans-serif" font-size="18" font-weight="normal">VIN+ and VIN− are NOT battery + and −. The speedometer’s 12.6 V is fixed artwork.</text>
