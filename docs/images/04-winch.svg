<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="4  |  Connect the winch controller">
<rect width="100%" height="100%" rx="22" fill="#101317"/>
<text x="44" y="54" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="bold">4  |  Connect the winch controller</text>
<text x="44" y="84" fill="#b8c1cb" font-family="Arial,sans-serif" font-size="18">GPIO5 controls the controller; it does not power the motor.</text>
<rect x="35" y="155" width="280" height="230" rx="14" fill="#1d242c" stroke="#566575" stroke-width="2"/>
<text x="55" y="190" text-anchor="start" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="bold">ESP32</text>
<text x="55" y="217" text-anchor="start" fill="#bac5cf" font-family="Arial,sans-serif" font-size="16" font-weight="normal">3.3 V signal output</text>
<rect x="465" y="135" width="310" height="280" rx="14" fill="#1d242c" stroke="#566575" stroke-width="2"/>
<text x="485" y="170" text-anchor="start" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="bold">WINCH CONTROLLER</text>
<text x="485" y="197" text-anchor="start" fill="#bac5cf" font-family="Arial,sans-serif" font-size="16" font-weight="normal">RC servo-style input</text>
<rect x="895" y="180" width="270" height="160" rx="14" fill="#1d242c" stroke="#566575" stroke-width="2"/>
<text x="915" y="215" text-anchor="start" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="bold">WINCH MOTOR</text>
<text x="915" y="242" text-anchor="start" fill="#bac5cf" font-family="Arial,sans-serif" font-size="16" font-weight="normal">Controller motor outputs</text>
<rect x="470" y="475" width="300" height="100" rx="14" fill="#1d242c" stroke="#566575" stroke-width="2"/>
<text x="490" y="510" text-anchor="start" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="bold">BATTERY / SUPPLY</text>
<text x="490" y="537" text-anchor="start" fill="#bac5cf" font-family="Arial,sans-serif" font-size="16" font-weight="normal">As specified by controller</text>
<text x="290" y="242" text-anchor="end" fill="#70baff" font-family="Arial,sans-serif" font-size="19" font-weight="bold">D5 / GPIO5</text>
<text x="290" y="322" text-anchor="end" fill="#c3cbd3" font-family="Arial,sans-serif" font-size="19" font-weight="bold">GND</text>
<polyline points="315,235 465,235" fill="none" stroke="#70baff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="315,315 465,315" fill="none" stroke="#c3cbd3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="485" y="242" text-anchor="start" fill="#70baff" font-family="Arial,sans-serif" font-size="19" font-weight="bold">SIGNAL IN</text>
<text x="485" y="322" text-anchor="start" fill="#c3cbd3" font-family="Arial,sans-serif" font-size="19" font-weight="bold">SIGNAL GND</text>
<polyline points="775,260 895,260" fill="none" stroke="#fb6472" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="620,475 620,415" fill="none" stroke="#fb6472" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="783" y="245" text-anchor="start" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="normal">motor leads</text>
<text x="638" y="449" text-anchor="start" fill="#fff" font-family="Arial,sans-serif" font-size="16" font-weight="normal">power leads</text>
<text x="600" y="615" text-anchor="middle" fill="#f5ce70" font-family="Arial,sans-serif" font-size="18" font-weight="normal">Controller signal + wire: insulate unless its manual specifies a safe power arrangement.</text>
</svg>
